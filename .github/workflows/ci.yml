name: CI

on:
  pull_request:
  push:
    branches: [main, publish]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      # Unit tests mock `electron`, so the ~100 MB binary is never executed. Skipping
      # the download keeps installs fast and deterministic, and makes a missing mock
      # fail immediately instead of depending on the download succeeding.
      - name: Install dependencies
        run: yarn install --immutable
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Format check
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Unit tests
        run: yarn test:unit

  e2e:
    name: e2e (Electron ${{ matrix.electron }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The current Electron, and the oldest one the SDK supports. Below Electron 35 the bridge
        # preload is registered through `setPreloads` instead of `registerPreloadScript`, and this
        # job is the only place that path runs against a real runtime.
        electron: ['41.1.0', '30.5.1']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      # The root install never runs Electron (unit tests mock it), so the binary download is
      # skipped here. `e2e/app` installs its own Electron and does download it.
      - name: Install dependencies
        run: yarn install --immutable
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # Electron links against the same system libraries as Chromium.
      - name: Install Electron system dependencies
        run: yarn playwright install-deps chromium

      - name: Pin the e2e app to Electron ${{ matrix.electron }}
        working-directory: e2e/app
        run: |
          node -e "const fs=require('fs'),p='package.json',j=JSON.parse(fs.readFileSync(p,'utf8'));j.devDependencies.electron=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')" '${{ matrix.electron }}'

      # Builds the SDK, then installs and builds the fixture app against it.
      - name: Build the SDK and the e2e app
        run: yarn test:e2e:init
        env:
          # The step above rewrites e2e/app/package.json, so that install cannot be immutable.
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'

      # GitHub runners check out as an unprivileged user, so Electron's setuid sandbox helper
      # lacks the root ownership and 4755 mode Chromium demands, and the app refuses to launch.
      # Fix it in place rather than passing --no-sandbox, so CI exercises the same process model
      # as production. Matched by path so every Electron install is covered.
      - name: Configure Electron's sandbox helper
        run: |
          find . -path '*/electron/dist/chrome-sandbox' -print0 \
            | xargs -0 -r sudo chown root:root
          find . -path '*/electron/dist/chrome-sandbox' -print0 \
            | xargs -0 -r sudo chmod 4755

      # After the build: the e2e tsconfig maps `@flashcatcloud/electron-sdk` to `dist/index.d.ts`.
      - name: Typecheck e2e
        run: yarn test:e2e:typecheck

      - name: E2E tests
        run: xvfb-run -a yarn test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-electron-${{ matrix.electron }}
          # Playwright resolves both directories against the working directory, not against the
          # config passed to `-c e2e`, so they land at the repository root.
          path: |
            test-results/
            playwright-report/
          retention-days: 7
