name: CI

on:
  pull_request:
  push:
    branches: [main, publish]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      # Unit tests mock `electron`, so the ~100 MB binary is never executed. Skipping
      # the download keeps installs fast and deterministic, and makes a missing mock
      # fail immediately instead of depending on the download succeeding.
      - name: Install dependencies
        run: yarn install --immutable
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Format check
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Unit tests
        run: yarn test:unit
