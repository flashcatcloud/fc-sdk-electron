name: Publish

# Release flow:
#   1. Merge the release into `publish` (package.json version is the source of truth).
#   2. Tag the merge commit `vX.Y.Z` (must match package.json version).
#   3. Run this workflow from that tag (Actions → Publish → select the tag).
# Use the `dry_run` input first to validate auth/build without publishing.
#
# `npm_tag` selects the dist-tag. Publishing under `next` leaves `npm install
# @flashcatcloud/electron-sdk` resolving to whatever `latest` already points at,
# so a release can be staged while its backend support is still rolling out.
# Promote it afterwards without republishing:
#   npm dist-tag add @flashcatcloud/electron-sdk@X.Y.Z latest

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip publish and GitHub release creation (dry run)'
        type: boolean
        default: false
      npm_tag:
        description: 'npm dist-tag to publish under'
        type: choice
        options:
          - latest
          - next
        default: latest

permissions:
  contents: write # create GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        env:
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$GH_REF" != refs/tags/* ]]; then
            echo "❌ Workflow must be triggered from a tag ref, not '$GH_REF'."
            echo "Open the workflow and select the release tag (e.g. v0.1.0) in the ref dropdown."
            exit 1
          fi
          TAG="$GH_REF_NAME"
          EXPECTED="v$EXPECTED_VERSION"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "❌ Tag mismatch: expected $EXPECTED, got $TAG"
            echo "Make sure package.json version matches the tag you are publishing from."
            exit 1
          fi
          echo "✅ Release tag validated: $TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Enable Corepack
        run: corepack enable

      # Unit tests mock `electron`; the binary is never executed here.
      - name: Install dependencies
        run: yarn install --immutable
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # Quality gate — fail the release before publishing if anything is broken.
      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Unit tests
        run: yarn test:unit

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --tag "$NPM_TAG" --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag }}

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag }}

      - name: Extract release notes from CHANGELOG.md
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk "/^## \[${VERSION}\]/{found=1} found && /^## / && !/^## \[${VERSION}\]/{exit} found{print}" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "⚠️ No changelog section found for v${VERSION}"
            echo "## [${VERSION}]" > release-notes.md
          fi

      # A `next` publish is not the release users get by default, so the GitHub
      # release must not claim to be either — otherwise the two disagree.
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          EXTRA=()
          if [ "$NPM_TAG" != "latest" ]; then
            EXTRA=(--prerelease --latest=false)
          fi
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            "${EXTRA[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TAG: ${{ inputs.npm_tag }}

      # A dry run publishes nothing, so it must not announce a release.
      - name: Notify deployment success
        if: ${{ success() && !inputs.dry_run }}
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: 'true'
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-electron 发布通知",
                "text": "### ✅ fc-sdk-electron 发布成功\n\n---\n\n 🔖 版本: v${{ steps.version.outputs.version }}\n\n 📦 包名: @flashcatcloud/electron-sdk\n\n 🏷️ dist-tag: ${{ inputs.npm_tag }}\n\n 👨‍💻 发布者: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }

      - name: Notify secondary DingTalk group on success
        if: ${{ success() && !inputs.dry_run }}
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: 'true'
          dingToken: ${{ secrets.DING_TALK_TOKEN_2 }}
          secret: ${{ secrets.DING_TALK_SECRET_2 }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-electron 发布通知",
                "text": "### ✅ fc-sdk-electron 发布成功\n\n---\n\n 🔖 版本: v${{ steps.version.outputs.version }}\n\n 📦 包名: @flashcatcloud/electron-sdk\n\n 🏷️ dist-tag: ${{ inputs.npm_tag }}\n\n 👨‍💻 发布者: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }

      - name: Notify deployment failure
        if: failure()
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: 'true'
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-electron 发布通知",
                "text": "### ❌ fc-sdk-electron 发布失败\n\n---\n\n 🔖 标签: ${{ github.ref_name }}\n\n 👨‍💻 发布者: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }
