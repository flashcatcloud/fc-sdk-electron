name: Publish

# Release flow:
#   1. Merge the release into `publish` (package.json version is the source of truth).
#   2. Tag the merge commit `vX.Y.Z` (must match package.json version).
#   3. Run this workflow from that tag (Actions → Publish → select the tag).
# Use the `dry_run` input first to validate auth/build without publishing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip publish and GitHub release creation (dry run)'
        type: boolean
        default: false

permissions:
  contents: write # create GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        env:
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$GH_REF" != refs/tags/* ]]; then
            echo "❌ Workflow must be triggered from a tag ref, not '$GH_REF'."
            echo "Open the workflow and select the release tag (e.g. v0.1.0) in the ref dropdown."
            exit 1
          fi
          TAG="$GH_REF_NAME"
          EXPECTED="v$EXPECTED_VERSION"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "❌ Tag mismatch: expected $EXPECTED, got $TAG"
            echo "Make sure package.json version matches the tag you are publishing from."
            exit 1
          fi
          echo "✅ Release tag validated: $TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Quality gate — fail the release before publishing if anything is broken.
      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Unit tests
        run: yarn test:unit

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract release notes from CHANGELOG.md
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk "/^## \[${VERSION}\]/{found=1} found && /^## / && !/^## \[${VERSION}\]/{exit} found{print}" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "⚠️ No changelog section found for v${VERSION}"
            echo "## [${VERSION}]" > release-notes.md
          fi

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
